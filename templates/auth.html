<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Finance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1e1b4b;
            min-height: 100vh;
            display: flex;
             flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        /* Minimalist Logo */
        .logo-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 20px auto;
            display: block;
            border-radius: 12px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        /* Simple Login / Register Switcher */
        .mode-switch {
            display: flex;
            background: #f5f3ff;
            border: 1px solid #ede9fe;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 22px;
        }

        .mode-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            color: #6d28d9;
            font-size: 14px;
            font-weight: 600;
            border-radius: 7px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: #7c3aed;
            color: #ffffff;
        }

        /* Error / Flash Message */
        .flash-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 18px;
            text-align: left;
        }

        /* Clean Inputs & Select Box (ChatGPT/Gemini Style) */
        .field-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-box, .select-box {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            color: #1e1b4b;
            background-color: #ffffff;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box:focus, .select-box:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        .select-box {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236d28d9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            background-color: #7c3aed;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #6d28d9;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <!-- Minimalist App Icon -->
        <svg class="logo-icon" viewBox="0 0 108 108">
            <rect width="108" height="108" rx="24" fill="#7C3AED"/>
            <path fill="#FFFFFF" d="M32,32 H68 V39 H32 Z M32,46 H62 V53 H32 Z M32,32 H48 C57,32 62,37 62,46 C62,54 56,59 46,59 H39 L60,82 H49 L29,59 V53 H45 C51,53 54,50 54,46 C54,41 51,39 45,39 H32 Z"/>
            <path fill="#FDE047" d="M77,22 L79,28 L85,30 L79,32 L77,38 L75,32 L69,30 L75,28 Z"/>
        </svg>

        <h1 id="pageHeading">Welcome back</h1>
        <p class="subtitle" id="pageSub">Sign in to your AI Finance account</p>

        <!-- Flash Error Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Login / Register Toggle -->
        <div class="mode-switch">
            <button type="button" class="mode-btn active" id="loginTab" onclick="setAuthMode('login')">Login</button>
            <button type="button" class="mode-btn" id="registerTab" onclick="setAuthMode('register')">Register</button>
        </div>

        <!-- Clean Form -->
        <form id="authForm" action="/login" method="POST">
            <div class="field-group">
                <input type="email" name="email" class="input-box" placeholder="Email address" required>
            </div>

            <div class="field-group">
                <input type="password" name="password" class="input-box" placeholder="Password" required>
            </div>

            <div class="field-group">
                <select name="role" class="select-box" required>
                    <option value="" disabled selected>Select your category</option>
                    <option value="business">Business</option>
                    <option value="student">Student</option>
                    <option value="job">Job Person</option>
                    <option value="worker">Any Worker</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Continue</button>
        </form>

        <p class="footer-note">AI Finance • Personal & Business Assistant</p>
    </div>

    <script>
        function setAuthMode(mode) {
            const form = document.getElementById('authForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const heading = document.getElementById('pageHeading');
            const sub = document.getElementById('pageSub');
            const btn = document.getElementById('submitBtn');

            if (mode === 'login') {
                form.action = '/login';
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                heading.innerText = 'Welcome back';
                sub.innerText = 'Sign in to your AI Finance account';
                btn.innerText = 'Continue';
            } else {
                form.action = '/register';
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                heading.innerText = 'Create an account';
                sub.innerText = 'Register with your email and category';
                btn.innerText = 'Create Account';
            }
        }
    </script>
</body>
</html>
