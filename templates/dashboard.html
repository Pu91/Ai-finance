<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Finance | Dashboard</title>
    <style>
        /* Base Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f8; margin: 0; padding-bottom: 120px; color: #2d333a;
        }
        
        /* Header & Sidebar */
        .header {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px); padding: 15px 20px;
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #e5e5ea;
        }
        .menu-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #2d333a; margin-right: 15px; }
        .header-title { font-size: 20px; font-weight: 700; margin: 0; }
        
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 250px; height: 100%;
            background: white; box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            transition: 0.3s ease; z-index: 200; padding: 20px; display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; }
        .close-btn { align-self: flex-end; background: none; border: none; font-size: 24px; cursor: pointer; color: #8e8ea0; }
        .nav-item { padding: 15px 0; font-size: 18px; color: #2d333a; text-decoration: none; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; }
        .nav-item i { margin-right: 15px; }
        
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); z-index: 150; display: none; opacity: 0; transition: 0.3s;
        }
        .overlay.active { display: block; opacity: 1; }

        /* Main Container & 3 Cards in a Row */
        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        
        .cards-row {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px;
        }
        @media (max-width: 600px) {
            /* For mobile, allows horizontal scroll to keep them in one line */
            .cards-row { display: flex; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
            .card { min-width: 80%; scroll-snap-align: center; }
        }
        
        .card {
            background: white; padding: 20px; border-radius: 20px;
            text-decoration: none; color: #2d333a; position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #f0f0f0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        
        .card-icon { font-size: 28px; margin-bottom: 10px; display: inline-block; padding: 10px; border-radius: 12px; }
        .card.daily .card-icon { background: #fff0ed; color: #ff6b6b; }
        .card.weekly .card-icon { background: #e8f5e9; color: #4caf50; }
        .card.monthly .card-icon { background: #e3f2fd; color: #2196f3; }
        
        .card-title { font-size: 14px; font-weight: 600; color: #8e8ea0; margin: 0 0 5px 0; }
        .card-amount { font-size: 26px; font-weight: 800; margin: 0; }

        /* Chat History Box */
        .chat-history {
            background: white; border-radius: 20px; padding: 20px; min-height: 200px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #f0f0f0; margin-bottom: 20px;
        }
        .chat-msg { margin-bottom: 15px; padding: 12px 16px; border-radius: 12px; font-size: 15px; max-width: 80%; }
        .chat-msg.user { background: #f0f0f0; margin-left: auto; border-bottom-right-radius: 2px; }
        .chat-msg.ai { background: #e3f2fd; color: #0d47a1; margin-right: auto; border-bottom-left-radius: 2px; font-weight: 500;}

        /* Footer & Apple/Gemini Voice Input */
        .chat-footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
            padding: 15px 0; border-top: 1px solid #e5e5ea; display: flex; justify-content: center; z-index: 90;
        }
        .chat-wrapper {
            display: flex; align-items: center; width: 100%; max-width: 800px; padding: 0 20px; gap: 10px;
        }
        .text-input {
            flex: 1; padding: 15px 20px; border-radius: 30px; border: 1px solid #d1d5db;
            font-size: 16px; outline: none; background: white; transition: 0.3s;
        }
        .text-input:focus { border-color: #10a37f; box-shadow: 0 0 0 2px rgba(16,163,127,0.2); }
        
        /* The Glowing Siri/Gemini Button */
        .siri-btn {
            width: 55px; height: 55px; border-radius: 50%; border: none; cursor: pointer;
            background: conic-gradient(from 0deg, #ff0080, #7928ca, #0070f3, #10a37f, #ff0080);
            animation: rotateOrb 4s linear infinite; position: relative;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .siri-btn::after {
            content: "🎙️"; font-size: 22px; position: absolute; background: white;
            width: 45px; height: 45px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center;
        }
        @keyframes rotateOrb { 100% { transform: rotate(360deg); } }

        /* Voice Popup Modal (Gemini Style) */
        .voice-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px);
            z-index: 300; display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .voice-modal.active { opacity: 1; pointer-events: auto; }
        
        .listening-text { font-size: 24px; font-weight: 600; color: #2d333a; margin-bottom: 40px; }
        
        .waves {
            display: flex; align-items: center; gap: 8px; height: 60px;
        }
        .wave {
            width: 8px; height: 20px; border-radius: 4px;
            background: linear-gradient(to top, #0070f3, #ff0080);
            animation: soundWave 1s ease-in-out infinite alternate;
        }
        .wave:nth-child(2) { animation-delay: 0.2s; }
        .wave:nth-child(3) { animation-delay: 0.4s; }
        .wave:nth-child(4) { animation-delay: 0.6s; }
        .wave:nth-child(5) { animation-delay: 0.8s; }
        
        @keyframes soundWave { 0% { height: 10px; } 100% { height: 60px; } }
        
        .close-modal {
            position: absolute; top: 30px; right: 30px; background: none; border: none; font-size: 30px; cursor: pointer; color: #8e8ea0;
        }
    </style>
</head>
<body>

    <!-- Sidebar & Overlay -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleSidebar()">✕</button>
        <div style="margin: 20px 0; text-align: center;">
            <div style="width: 60px; height: 60px; background: #10a37f; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 10px auto; font-weight: bold;">
                {{ username[0]|upper }}
            </div>
            <h3 style="margin:0;">{{ username }}</h3>
            <p style="color:#8e8ea0; font-size:12px; margin-top:5px;">AI Finance Member</p>
        </div>
        <hr style="border:0; border-top:1px solid #f0f0f0; margin-bottom:20px;">
        <a href="#" class="nav-item">👤 Profile</a>
        <a href="#" class="nav-item">⚙️ Settings</a>
        <a href="/logout" class="nav-item" style="color: #d93025; margin-top: auto;">🚪 Logout</a>
    </div>

    <!-- Header -->
    <div class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h2 class="header-title">AI Finance</h2>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- 3 Cards Row -->
        <div class="cards-row">
            <a href="/details/daily" class="card daily">
                <div class="card-icon">📅</div>
                <p class="card-title">Today's Expense</p>
                <p class="card-amount">৳ <span class="counter" data-target="{{ daily }}">0</span></p>
            </a>
            <a href="/details/weekly" class="card weekly">
                <div class="card-icon">📊</div>
                <p class="card-title">Weekly Expense</p>
                <p class="card-amount">৳ <span class="counter" data-target="{{ weekly }}">0</span></p>
            </a>
            <a href="/details/monthly" class="card monthly">
                <div class="card-icon">💰</div>
                <p class="card-title">Monthly Expense</p>
                <p class="card-amount">৳ <span class="counter" data-target="{{ monthly }}">0</span></p>
            </a>
        </div>

        <!-- AI Chat Box -->
        <div class="chat-history" id="chatBox">
            <div class="chat-msg ai">✨ হ্যালো! আমি আপনার স্মার্ট ফাইন্যান্স এআই। আপনার আজকের খরচের হিসাব বলতে নিচের মাইকে চাপ দিন।</div>
        </div>
    </div>

    <!-- Chat Footer -->
    <div class="chat-footer">
        <div class="chat-wrapper">
            <input type="text" id="textInput" class="text-input" placeholder="Message AI Finance..." onkeypress="handleEnter(event)">
            <button class="siri-btn" onclick="openVoiceModal()"></button>
        </div>
    </div>

    <!-- Voice Popup Modal (Gemini Style) -->
    <div class="voice-modal" id="voiceModal">
        <button class="close-modal" onclick="closeVoiceModal()">✕</button>
        <div class="listening-text" id="voiceText">AI শুনছে... কথা বলুন</div>
        <div class="waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>

    <script>
        // Sidebar Toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // Number Counter Animation
        const counters = document.querySelectorAll('.counter');
        counters.forEach(counter => {
            const target = +counter.getAttribute('data-target');
            const increment = target / 60;
            let current = 0;
            const updateCounter = () => {
                current += increment;
                if(current < target) {
                    counter.innerText = Math.ceil(current);
                    requestAnimationFrame(updateCounter);
                } else {
                    counter.innerText = target;
                }
            };
            if(target > 0) updateCounter();
        });

        // Speech Recognition Setup
        const voiceModal = document.getElementById('voiceModal');
        const voiceText = document.getElementById('voiceText');
        const chatBox = document.getElementById('chatBox');
        let recognition;
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';
            recognition.continuous = false;
            
            recognition.onstart = () => {
                voiceText.innerText = "শুনছি... কথা বলুন";
            };
            
            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                voiceText.innerText = "প্রসেস করা হচ্ছে...";
                setTimeout(() => {
                    closeVoiceModal();
                    addChat(speechToText, 'user');
                    sendDataToAI(speechToText);
                }, 1000);
            };

            recognition.onerror = () => {
                voiceText.innerText = "বুঝতে পারিনি, আবার চেষ্টা করুন";
                setTimeout(closeVoiceModal, 1500);
            };
        }

        function openVoiceModal() {
            if(recognition) {
                voiceModal.classList.add('active');
                recognition.start();
            } else {
                alert("আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই। দয়া করে Chrome ব্যবহার করুন।");
            }
        }

        function closeVoiceModal() {
            voiceModal.classList.remove('active');
            if(recognition) recognition.stop();
        }

        // Text Chat Logic
        function handleEnter(e) {
            if(e.key === 'Enter') {
                const input = document.getElementById('textInput');
                const text = input.value;
                if(text) {
                    addChat(text, 'user');
                    input.value = '';
                    sendDataToAI(text);
                }
            }
        }

        function addChat(text, sender) {
            const div = document.createElement('div');
            div.className = `chat-msg ${sender}`;
            div.innerText = text;
            chatBox.appendChild(div);
            // Scroll to bottom
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function sendDataToAI(text) {
            addChat("AI প্রসেস করছে...", 'ai'); // Temp message
            
            fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text: text})
            })
            .then(res => res.json())
            .then(data => {
                // Remove temp message
                chatBox.removeChild(chatBox.lastChild);
                addChat(data.reply, 'ai');
                
                // Refresh numbers after 2 seconds without reloading the whole page (or reload if you prefer)
                setTimeout(() => location.reload(), 2000);
            });
        }
    </script>
</body>
</html>
